name: R1 Android SQLite verification
on:
  pull_request:
    paths:
      - 'app/src/main/java/org/nasedka/app/BackupStore.java'
      - 'app/src/main/java/org/nasedka/app/Db.java'
      - 'app/src/main/java/org/nasedka/app/FarmDb.java'
      - 'app/src/main/java/org/nasedka/app/Restore*.java'
      - 'app/src/androidTest/**'
      - 'tools/r1/process_death.py'
      - 'app/build.gradle'
      - '.github/workflows/r1-android-sqlite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-sqlite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and prepare isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          # Both tools must resolve the same isolated AVD directory.
          export ANDROID_USER_HOME="$RUNNER_TEMP/r1-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force --name r1_sqlite --package 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/r1_sqlite.avd"
          # Fail here, not after a long adb timeout, if creation did not work.
          ls -la "$ANDROID_AVD_HOME"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.ini"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx r1_sqlite
      - name: Execute real Android SQLite tests
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          serial=emulator-5554
          log="$RUNNER_TEMP/r1-emulator.log"
          : > "$log"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.ini"
          "$emulator" -list-avds | grep -Fx r1_sqlite
          "$adb" start-server
          "$emulator" -avd r1_sqlite -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "::error::Android verification failed (exit $result)"
              tail -n 100 "$log" || true
              timeout 10 "$adb" devices -l || true
            fi
            timeout 10 "$adb" -s "$serial" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            return "$result"
          }
          trap cleanup EXIT
          # Monitor both process liveness and Android boot, not just adb.
          deadline=$((SECONDS + 420))
          booted=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator exited before boot"
              exit 1
            fi
            state="$(timeout 10 "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = 1 ]; then booted=1; break; fi
            sleep 3
          done
          if [ "$booted" != 1 ]; then
            echo "::error::Android boot did not complete within the allowed window"
            exit 124
          fi
          "$adb" -s "$serial" shell input keyevent 82
          api="$("$adb" -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$api" = 35
          "$adb" devices -l
          gradle --no-daemon connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=org.nasedka.app.RestoreProcessDeathTest
          python3 tools/r1/process_death.py "$adb" "$serial" "$RUNNER_TEMP/r1-process-death"
      - name: Verify actual test execution (no empty PASS)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          cases = [c for p in files for c in ET.parse(p).getroot().iter("testcase")
                   if c.get("classname","").endswith(".BackupReliabilityTest")]
          expected = {
              "currentRoundTripAllFourteenTables", "v2MissingAnyTableIsRejected",
              "v1OnlyAbsentNotesAllowed", "brokenTransferReferencesAndQuantityRejected",
              "farmV1MigrationPreservesRowsAndIds", "incV1ReconstructedMigrationPreservesRows",
              "farmV1BackupMigratesWithoutNotes", "coercedVersionsAndSettingsRejected",
              "missingNullAndNonIntegerRowFieldsRejectedWithoutPartialInsert",
              "legacyOnlyHatchedAtDefaultIsNormalized",
          }
          names = {c.get("name") for c in cases}
          assert expected <= names, f"Missing executed tests: {expected - names}"
          assert all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in cases), "Failure or skipped test"
          print(f"R1: {len(cases)} executed Android SQLite tests; required methods present.")
          storage_cases = [c for p in files for c in ET.parse(p).getroot().iter("testcase")
                           if c.get("classname","").endswith(".RestoreFileStorageTest")]
          storage_expected = set(["restoreTwoSqliteFilesAndSettings","recoverAfterOneFileReplacement","failedSettingsWriteAfterBothDatabasesRecovers","corruptRollbackSourceKeepsJournalAndOtherCopies","legacyMarkerAndSidecarsBlockBeforeMutation","preparedWalPreservesCommittedRows","missingSqliteIsNotCreatedByPreparation","insufficientSpaceRejectsBeforeJournalOrLiveChanges","settingsFailureAfterWriteStillRollsBack","repeatedRecoveryAfterPartialRollback","committedRecoveryAfterPartialCleanupRetainsNewData","legacyRecoveryAcrossAllFiveRenamePrefixes","legacyRecoveryRepeatsAfterFirstCopy","legacyAmbiguousOrMalformedMarkerPreservesFiles","legacyConflictingJournalOrFailedValidationBlocksReplacement","legacyRecoveryValidatesRealVersionTwoSchemas","realWriteDenialDuringApplyRetainsPending","realWriteDenialDuringCommitPublicationRollsBack","realWriteDenialDuringRollbackPreservesSources"])
          assert len(storage_cases) == len(storage_expected), "Wrong storage test count"
          assert {c.get("name") for c in storage_cases} == storage_expected, "Missing/unexpected storage tests"
          assert all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in storage_cases)
          print(f"R1: {len(storage_cases)} executed Android file storage tests; required methods present.")
          PY
      - name: Preserve small test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-android-sqlite-evidence
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            ${{ runner.temp }}/r1-emulator.log
            ${{ runner.temp }}/r1-process-death/**
          retention-days: 3
          if-no-files-found: warn

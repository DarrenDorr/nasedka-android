name: R1 Android SQLite verification
on:
  pull_request:
    paths:
      - 'app/src/main/java/org/nasedka/app/BackupStore.java'
      - 'app/src/main/java/org/nasedka/app/Db.java'
      - 'app/src/main/java/org/nasedka/app/FarmDb.java'
      - 'app/src/main/java/org/nasedka/app/Restore*.java'
      - 'app/src/main/java/org/nasedka/app/DataAccessCoordinator.java'
      - 'app/src/test/java/org/nasedka/app/DataAccessCoordinatorTest.java'
      - 'app/src/androidTest/**'
      - 'tools/r1/process_death.py'
      - 'tools/r1/android_enospc.sh'
      - 'app/build.gradle'
      - '.github/workflows/r1-android-sqlite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-sqlite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and prepare isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          # Both tools must resolve the same isolated AVD directory.
          export ANDROID_USER_HOME="$RUNNER_TEMP/r1-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force --name r1_sqlite --package 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/r1_sqlite.avd"
          # Fail here, not after a long adb timeout, if creation did not work.
          ls -la "$ANDROID_AVD_HOME"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.ini"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx r1_sqlite
      - name: Execute real Android SQLite tests
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          serial=emulator-5554
          log="$RUNNER_TEMP/r1-emulator.log"
          : > "$log"
          test -s "$ANDROID_AVD_HOME/r1_sqlite.ini"
          "$emulator" -list-avds | grep -Fx r1_sqlite
          "$adb" start-server
          "$emulator" -avd r1_sqlite -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "::error::Android verification failed (exit $result)"
              tail -n 100 "$log" || true
              timeout 10 "$adb" devices -l || true
            fi
            timeout 10 "$adb" -s "$serial" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            return "$result"
          }
          trap cleanup EXIT
          # Monitor both process liveness and Android boot, not just adb.
          deadline=$((SECONDS + 420))
          booted=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator exited before boot"
              exit 1
            fi
            state="$(timeout 10 "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = 1 ]; then booted=1; break; fi
            sleep 3
          done
          if [ "$booted" != 1 ]; then
            echo "::error::Android boot did not complete within the allowed window"
            exit 124
          fi
          "$adb" -s "$serial" shell input keyevent 82
          api="$("$adb" -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$api" = 35
          "$adb" devices -l
          gradle --no-daemon connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=org.nasedka.app.RestoreProcessDeathTest
          # connectedAndroidTest owns installation/cleanup; its APKs need not
          # remain installed after the standard test run. Reinstall explicitly.
          mkdir -p "$RUNNER_TEMP/r1-process-death"
          mapfile -t app_apks < <(find app/build/outputs/apk/github/debug -type f -name '*.apk' | sort)
          mapfile -t test_apks < <(find app/build/outputs/apk/androidTest/github/debug -type f -name '*.apk' | sort)
          test "${#app_apks[@]}" = 1
          test "${#test_apks[@]}" = 1
          "$adb" -s "$serial" install -r -t "${app_apks[0]}"
          "$adb" -s "$serial" install -r -t "${test_apks[0]}"
          "$adb" -s "$serial" shell pm list instrumentation | tee "$RUNNER_TEMP/r1-process-death/instrumentation-list.txt"
          grep -F 'instrumentation:org.nasedka.app.debug.test/androidx.test.runner.AndroidJUnitRunner (target=org.nasedka.app.debug)' "$RUNNER_TEMP/r1-process-death/instrumentation-list.txt"
          python3 tools/r1/process_death.py "$adb" "$serial" "$RUNNER_TEMP/r1-process-death"
          bash tools/r1/android_enospc.sh "$adb" "$serial" "$RUNNER_TEMP/r1-android-enospc"
      - name: Verify actual test execution (no empty PASS)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          cases = [c for p in files for c in ET.parse(p).getroot().iter("testcase")
                   if c.get("classname","").endswith(".BackupReliabilityTest")]
          expected = {
              "currentRoundTripAllFourteenTables", "v2MissingAnyTableIsRejected",
              "v1OnlyAbsentNotesAllowed", "brokenTransferReferencesAndQuantityRejected",
              "farmV1MigrationPreservesRowsAndIds", "incV1ReconstructedMigrationPreservesRows",
              "farmV1BackupMigratesWithoutNotes", "coercedVersionsAndSettingsRejected",
              "missingNullAndNonIntegerRowFieldsRejectedWithoutPartialInsert",
              "legacyOnlyHatchedAtDefaultIsNormalized",
          }
          names = {c.get("name") for c in cases}
          assert names == expected and len(cases) == len(expected), f"Wrong executed tests: {names}"
          assert all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in cases), "Failure or skipped test"
          print(f"R1: {len(cases)} executed Android SQLite tests; required methods present.")
          storage_cases = [c for p in files for c in ET.parse(p).getroot().iter("testcase")
                           if c.get("classname","").endswith(".RestoreFileStorageTest")]
          storage_expected = set(["restoreTwoSqliteFilesAndSettings","recoverAfterOneFileReplacement","failedSettingsWriteAfterBothDatabasesRecovers","corruptRollbackSourceKeepsJournalAndOtherCopies","legacyMarkerAndSidecarsBlockBeforeMutation","preparedWalPreservesCommittedRows","missingSqliteIsNotCreatedByPreparation","insufficientSpaceRejectsBeforeJournalOrLiveChanges","settingsFailureAfterWriteStillRollsBack","repeatedRecoveryAfterPartialRollback","committedRecoveryAfterPartialCleanupRetainsNewData","legacyRecoveryAcrossAllFiveRenamePrefixes","legacyRecoveryRepeatsAfterFirstCopy","legacyAmbiguousOrMalformedMarkerPreservesFiles","legacyConflictingJournalOrFailedValidationBlocksReplacement","legacyRecoveryValidatesRealVersionTwoSchemas","realWriteDenialDuringApplyRetainsPending","realWriteDenialDuringCommitPublicationRollsBack","realWriteDenialDuringRollbackPreservesSources","ambiguousCommittedForceRetainsCopiesUntilResynced","ambiguousRolledBackForceRetainsCopiesUntilResynced","ambiguousJournalRemovalRequiresDurableAbsence","generationCommitAndRollbackPreserveCorrectUuid","legacySettingsEncodingRemainsByteIdenticalAndRemovesGeneration","malformedGenerationAndUnknownVersionRejectWithoutMutation","targetGenerationIgnoresImportedUuidAndSchedulerState","generationTokenChangesOnlyAfterVerifiedRestoreOutcome","startupGenerationInitializationIsStableAndPreservesSettings","falseCommitQuarantinesCachedGenerationAcrossAdapterInstances","falseCommitDuringRestoreRetainsPendingAndBlocksSameProcessRecovery"])
          assert len(storage_cases) == len(storage_expected), "Wrong storage test count"
          assert {c.get("name") for c in storage_cases} == storage_expected, "Missing/unexpected storage tests"
          assert all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in storage_cases)
          print(f"R1: {len(storage_cases)} executed Android file storage tests; required methods present.")
          startup_cases = [c for p in files for c in ET.parse(p).getroot().iter("testcase")
                           if c.get("classname","") == "org.nasedka.app.RestoreStartupFilesTest"]
          startup_expected = set(["freshStartupCreatesActualSchemasAndStableGeneration","historicalPartialPairPreservesExistingRows","establishedMissingDatabaseIsNotRecreated","orphanSidecarOrInitializationStageBlocksCreation","malformedJournalAndLegacyConflictPreserveEvidence","v2PendingRecoveredBeforeOpeningActualPair","corruptDatabaseIsPreservedAndPartnerNotCreated","legacyRemnantsWithoutMarkerRemainBlockedAndUntouched"])
          assert len(startup_cases) == len(startup_expected)
          assert {c.get("name") for c in startup_cases} == startup_expected
          assert all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in startup_cases)
          print(f"R1: {len(startup_cases)} executed Android startup file tests; required methods present.")
          PY
      - name: Verify process death evidence (six independent recoveries)
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/r1-process-death/process-death.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          expected = {
              "prepared": ("NONE", "NO_PENDING"),
              "first-db": ("PENDING", "OLD_GENERATION"),
              "settings": ("PENDING", "OLD_GENERATION"),
              "committed": ("COMMITTED", "NEW_GENERATION"),
              "rollback": ("PENDING", "OLD_GENERATION"),
              "rolled-back-cleanup": ("ROLLED_BACK", "OLD_GENERATION"),
          }
          assert data["api"] == 35
          cases = data["cases"]
          assert len(cases) == len(expected)
          assert {c["case"] for c in cases} == set(expected)
          for c in cases:
              assert (c["phase"], c["outcome"]) == expected[c["case"]]
              assert c["result"] == "PASS"
              assert c["killed_pid"] > 0 and c["recovery_pid"] > 0
              assert c["killed_pid"] != c["recovery_pid"]
          print("R1 process death evidence: 6 distinct cases verified")
          PY
      - name: Verify Android bounded ENOSPC evidence
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/r1-android-enospc" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path(sys.argv[1])
          witness=(p/"verified.txt").read_text().strip().split()
          assert len(witness)==3 and witness[0]=="ANDROID_ENOSPC_PASS"
          assert 4*1024*1024 <= int(witness[1]) <= 16*1024*1024
          assert int(witness[2])>0
          log=(p/"instrumentation.log").read_text()
          assert re.search(r"OK\s*\(1 test\)",log) and "INSTRUMENTATION_CODE: -1" in log
          assert " tmpfs " in (p/"mount.txt").read_text()
          print("R1 Android bounded ENOSPC evidence verified")
          PY
      - name: Preserve small test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-android-sqlite-evidence
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            ${{ runner.temp }}/r1-emulator.log
            ${{ runner.temp }}/r1-process-death/**
            ${{ runner.temp }}/r1-android-enospc/**
          retention-days: 3
          if-no-files-found: warn

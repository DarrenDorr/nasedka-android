name: Android build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform (runner SDK)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on runner}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          echo "SDK manager: $sdkmanager_path"
          "$sdkmanager_path" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure persistent testing signature when secrets are available
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NASEDKA_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NASEDKA_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NASEDKA_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NASEDKA_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            test -n "$STORE_PASSWORD"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nasedka-continuous-debug.jks"
            chmod 600 "$RUNNER_TEMP/nasedka-continuous-debug.jks"
            echo "NASEDKA_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/nasedka-continuous-debug.jks" >> "$GITHUB_ENV"
            echo "NASEDKA_DEBUG_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NASEDKA_DEBUG_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NASEDKA_DEBUG_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_DEBUG_CERTIFICATE_CONFIGURED" > signing-status.txt
          else
            echo "::warning::No persistent test signing key configured; debug APK certificate may change between runs. DO NOT UNINSTALL an existing app with important data."
            echo "EPHEMERAL_DEBUG_CERTIFICATE__UPGRADES_NOT_GUARANTEED" > signing-status.txt
          fi
      - name: Test and build all three debug variants
        run: gradle --no-daemon testGithubDebugUnitTest assembleGithubDebug assemblePlayDebug assembleRustoreDebug assembleGithubDebugAndroidTest
      - name: Verify R1 restore JVM test evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testGithubDebugUnitTest")
          required = {
              "RestoreProtocolTest": ["successfulRestoreCommitsAllThreeAndClearsJournal","beforeAndAfterEveryRestoreBoundaryRecoversCorrectGeneration","repeatedInterruptionDuringRollbackIsRecoverable","settingsCommitFailureDoesNotCommitDatabases","pendingRestoreRejectsAnotherRestoreWithoutWriting","corruptJournalFailsClosed","missingRollbackCopiesRemainPending","corruptCommittedGenerationDoesNotCleanupOrRollback","committedCleanupFailureNeverRollsBack"],
              "RestoreJournalTest": ["commitSurvivesReopenAndClearsOnlyTerminal","rollbackTerminalSurvivesReopen","wrongGenerationOrHashesCannotPublishOrClear","invalidTransitionsDoNotChangeJournal","damagedJournalIsNotTreatedAsMissing","orphanTemporaryDoesNotOverrideAuthoritativeJournal","oversizedOrNonRegularJournalFailsClosed","missingDirectoryIsNotAnEmptyJournal"],
          }
          for suite, names in required.items():
              report = ET.parse(root / ("TEST-org.nasedka.app." + suite + ".xml")).getroot()
              cases = report.findall("testcase")
              assert len(cases) == len(names), f"{suite}: wrong test count"
              assert {c.get("name") for c in cases} == set(names), f"{suite}: missing/unexpected methods"
              assert all(c.get("classname") == "org.nasedka.app." + suite for c in cases)
              assert all(int(report.get(k, "-1")) == 0 for k in ("failures", "errors", "skipped"))
              assert not any(c.find(k) is not None for c in cases for k in ("failure", "error", "skipped"))
              print(f"{suite}: {len(cases)} executed, 0 failures/errors/skipped")
          PY
      - name: Execute real bounded filesystem ENOSPC probe (Linux)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/r1/enospc.sh 2>&1 | tee "$RUNNER_TEMP/r1-enospc.log"
          grep -Fx 'R1 bounded Linux tmpfs ENOSPC: PASS' "$RUNNER_TEMP/r1-enospc.log"
      - name: Preserve bounded filesystem probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-enospc-evidence
          path: ${{ runner.temp }}/r1-enospc.log
          retention-days: 3
          if-no-files-found: warn
      - name: Preserve R1 restore JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-restore-jvm-evidence
          path: app/build/test-results/testGithubDebugUnitTest/TEST-org.nasedka.app.Restore*Test.xml
          retention-days: 3
          if-no-files-found: warn
      - name: Save GitHub APK for installation tests
        uses: actions/upload-artifact@v4
        with:
          name: Nasedka-github-debug-apk
          path: |
            app/build/outputs/apk/github/debug/*.apk
            signing-status.txt
          if-no-files-found: error
      - name: Save store variants for smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: Nasedka-stores-debug-apks
          path: |
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/rustore/debug/*.apk
          if-no-files-found: error

plugins {
    id 'com.android.application'
}

def stableDebugKeystore = System.getenv('NASEDKA_DEBUG_KEYSTORE_FILE')

android {
    namespace 'org.nasedka.app'
    compileSdk 36

    defaultConfig {
        applicationId 'org.nasedka.app'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '0.9.0-dev'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    flavorDimensions 'distribution'
    productFlavors {
        github { dimension 'distribution' }
        play { dimension 'distribution' }
        rustore { dimension 'distribution' }
    }

    signingConfigs {
        if (stableDebugKeystore != null && !stableDebugKeystore.trim().isEmpty()) {
            continuousDebug {
                storeFile file(stableDebugKeystore)
                storePassword System.getenv('NASEDKA_DEBUG_STORE_PASSWORD')
                keyAlias System.getenv('NASEDKA_DEBUG_KEY_ALIAS')
                keyPassword System.getenv('NASEDKA_DEBUG_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            if (stableDebugKeystore != null && !stableDebugKeystore.trim().isEmpty()) {
                signingConfig signingConfigs.continuousDebug
            }
        }
    }
    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    githubImplementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
